const $=id=>document.getElementById(id);
function node(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined)el.textContent=txt;return el}
function drawTabs(container,items,selected,choose){container.replaceChildren();items.forEach(([key,label])=>{let b=node("button",key===selected?"active":"",label);b.type="button";b.onclick=()=>choose(key);container.append(b)})}
function render(){
 drawTabs($("rubrics"),DATA.rubrics,rubric,k=>{rubric=k;topic="ВСЕ";search="";limit="all";render()});
 const name=DATA.rubrics.find(x=>x[0]===rubric)[1];$("rubric-title").textContent=name;
 const all=rubric==="GEOGRAFIA"?DATA.questions:[];
 $("total").textContent=all.length+" вопросов";
 const names=rubric==="GEOGRAFIA"?DATA.topics:DATA.subtopics[rubric]||[];
 const ts=[["ВСЕ","Все вопросы"],...names.map(t=>[t,t+" · "+all.filter(q=>q.topic===t).length])];
 drawTabs($("topics"),ts,topic,k=>{topic=k;search="";limit="all";render()});
 const body=$("body");body.replaceChildren();
 if(!all.length){body.append(node("div","empty","Раздел «"+(topic==="ВСЕ"?"Все вопросы":topic)+"» пока не заполнен. Переключение вкладок работает; сюда можно будет добавить вопросы."));return}
 const tools=node("div","filters");
 const inp=node("input");inp.placeholder="Поиск по вопросу или переводу";inp.value=search;
 const sel=node("select");[["all","Все вопросы"],["5","Показать 5"],["10","Показать 10"]].forEach(([v,t])=>{let o=node("option","",t);o.value=v;sel.append(o)});sel.value=limit;
 tools.append(inp,sel);body.append(tools);
 const list=node("div");body.append(list);
 function refresh(){
  const qs=all.filter(q=>(topic==="ВСЕ"||q.topic===topic)&&(q.es+" "+q.ru+" "+q.id).toLowerCase().includes(search.toLowerCase()));
  list.replaceChildren();
  const caption=node("p","muted","Найдено: "+qs.length+" · показано: "+(limit==="all"?qs.length:Math.min(qs.length,Number(limit))));list.append(caption);
  qs.slice(0,limit==="all"?undefined:Number(limit)).forEach(q=>{
   const card=node("article","card");
   const meta=node("div","qhead");meta.append(node("span","",q.id),node("span","",q.topic));card.append(meta);
   card.append(node("div","es",q.es),node("p","ru",q.ru));
   const opts=node("div","answers");
   q.opts.forEach((value,i)=>{let el=node("div","opt"+(q.answer==="ABCD"[i]?" correct":""));el.append(node("b","","ABCD"[i]+")"),document.createTextNode(value));opts.append(el)});
   card.append(opts);list.append(card);
  });
 }
 inp.oninput=()=>{search=inp.value;refresh()};sel.onchange=()=>{limit=sel.value;refresh()};refresh();
}
render();
</script></body></html>
